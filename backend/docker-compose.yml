services:
  infybuys-postgres-local:
    image: postgres:15
    container_name: infybuys-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infybuys
    ports:
      - "5433:5432"
    volumes:
      - infybuys-postgres-local-data:/var/lib/postgresql/data

volumes:
  infybuys-postgres-local-data: